<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>JULE</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;color:#202124;background:#fff;min-height:100vh;display:flex;flex-direction:column}.bar{display:flex;gap:8px;padding:10px;border-bottom:1px solid #ddd}.bar button{border:0;background:#f1f3f4;border-radius:18px;padding:8px 12px}.bar input{flex:1;border:1px solid #ddd;border-radius:20px;padding:9px 15px}.main{flex:1;display:flex;align-items:center;justify-content:center;text-align:center}.logo{width:190px}.title{font-size:64px;font-weight:800;margin:0}.tag{color:#6b7280}footer{text-align:center;font-size:11px;color:#777;padding:16px}</style></head><body><div class="bar"><button onclick="jule.back()">←</button><button onclick="jule.forward()">→</button><button onclick="jule.home()">⌂</button><button onclick="jule.reload()">↻</button><input id="u" placeholder="Enter a web address"><button onclick="go()">Open</button></div><main class="main"><div><img class="logo" src="../assets/jule-logo.png"><h1 class="title">JULE</h1><p class="tag">Open Anything.</p></div></main><footer>© 2026 JSL-ian Technologies Ltd. All Rights Reserved.</footer><script>function go(){let v=document.getElementById('u').value.trim();if(!v||/\s/.test(v))return;if(!/^https?:\/\//i.test(v))v='https://'+v;jule.open(v)}document.getElementById('u').addEventListener('keydown',e=>{if(e.key==='Enter')go()})</script></body></html>
